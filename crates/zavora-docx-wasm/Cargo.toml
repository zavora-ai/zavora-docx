[package]
name = "zavora-docx-wasm"
description = "WebAssembly bindings for zavora-docx — DOCX creation, reading, and conversion in the browser"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94.1"
authors = ["Atul Sharma"]
repository = "https://github.com/zavora-ai/zavora-docx"
homepage = "https://zavora.ai"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zavora-docx-opc = { path = "../zavora-docx-opc" }
zavora-docx-oxml = { path = "../zavora-docx-oxml" }
zavora-docx-html = { path = "../zavora-docx-html" }
wasm-bindgen = "0.2"
js-sys = "0.3"
